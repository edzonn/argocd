apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test-application-argocd
  namespace: argocd
spec:
  destination:
    namespace: test-application-argocd
    server: https://kubernetes.default.svc
  project: sample-project
  source:
    path: sample-app/
    repoURL: https://github.com/edzonn/argocd.git
    targetRevision: HEAD
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true